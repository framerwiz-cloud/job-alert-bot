# Non-secret settings. Secrets (webhook URL, IMAP password) go in .env instead.

# A job alerts if its title or description contains ANY of these (case-insensitive).
# Upwork filtering happens on Upwork's side via your saved-search alerts, so this list
# mainly matters for Freelancer.com -- but it's applied to every source as a safety net.
keywords:
  - Framer
  - Webflow
  - WordPress
  - Elementor
  - Web Design
  - Landing Page

# Skip jobs below this budget (USD). Set to 0 to disable. Hourly jobs are never filtered by this.
min_budget: 0
